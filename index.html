<!DOCTYPE html>
<html>
<head>
    <title>Hsmoits vs Slipzy LIVE</title>
    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .main-container {
            width: 95%;
            max-width: 1200px;
            text-align: center;
        }
        /* This hides the extra junk from the source site so you only see the numbers */
        .count-frame {
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            border-radius: 15px;
            background: #111;
        }
        .header {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ff253a;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">Live Subscriber Battle</div>
        
        <div class="grid">
            <iframe 
                class="count-frame" 
                src="https://livecounts.io/embed/youtube-live-subscriber-counter/UCTuC24xs84SjkcWiUJMipiw" 
                style="border:none;">
            </iframe>

            <iframe 
                class="count-frame" 
                src="https://livecounts.io/embed/youtube-live-subscriber-counter/UC_dC2t2tNt0ud25kXptF2Xw" 
                style="border:none;">
            </iframe>
        </div>
    </div>

</body>
</html>
