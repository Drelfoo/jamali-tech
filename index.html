<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LIVE SUB BATTLE</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; }
        .card { background: #111; border: 4px solid #333; border-radius: 20px; padding: 50px 20px; text-align: center; }
        .name { font-size: 2rem; margin-bottom: 20px; color: #888; text-transform: uppercase; }
        .count { font-size: 6rem; font-weight: bold; font-family: monospace; }
        #gap-box { margin-top: 40px; font-size: 3rem; color: #7fff00; background: #222; padding: 10px 50px; border-radius: 50px; }
        .status { margin-top: 10px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>

    <div class="grid">
        <div class="card">
            <div class="name">Hsmoits</div>
            <div id="hs-count" class="count">LOADING</div>
        </div>
        <div class="card">
            <div class="name">Slipzy</div>
            <div id="sl-count" class="count">LOADING</div>
        </div>
    </div>

    <div id="gap-box">GAP: --</div>
    <div class="status" id="debug">Connecting to YouTube Data Stream...</div>

    <script>
        async function getStats() {
            try {
                // Using Mixerno's public endpoint - very stable for 2026
                const hsRes = await fetch('https://mixerno.space/api/youtube-channel-counter/user/UCTuC24xs84SjkcWiUJMipiw');
                const slRes = await fetch('https://mixerno.space/api/youtube-channel-counter/user/UC_dC2t2tNt0ud25kXptF2Xw');
                
                const hsData = await hsRes.json();
                const slData = await slRes.json();

                // Mixerno uses .counts[0].count for the sub value
                const hsVal = hsData.counts[0].count;
                const slVal = slData.counts[0].count;

                document.getElementById('hs-count').innerText = hsVal.toLocaleString();
                document.getElementById('sl-count').innerText = slVal.toLocaleString();
                document.getElementById('gap-box').innerText = "GAP: " + Math.abs(hsVal - slVal).toLocaleString();
                document.getElementById('debug').innerText = "STREAMS ACTIVE - UPDATED AT " + new Date().toLocaleTimeString();

            } catch (err) {
                document.getElementById('debug').innerText = "ERROR: Bridge Busy. Retrying...";
                console.error(err);
            }
        }

        setInterval(getStats, 2000);
        getStats();
    </script>
</body>
</html>
