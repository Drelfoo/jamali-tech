<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hsmoits vs Slipzy | LIVE</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; max-width: 1000px; }
        .card { background: #0d0d0d; border: 2px solid #222; border-radius: 15px; padding: 40px; text-align: center; position: relative; }
        .hs-banner { position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: #7fff00; border-radius: 15px 15px 0 0; }
        .name { font-size: 1.5rem; margin-bottom: 10px; color: #aaa; }
        .count { font-size: 5rem; font-weight: 900; color: #ff253a; }
        .gap-box { margin-top: 30px; background: linear-gradient(90deg, #ff0000, #0000ff); padding: 20px 80px; border-radius: 10px; font-size: 2.5rem; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <div class="hs-banner"></div>
            <div class="name">Hsmoits</div>
            <div id="hs-count" class="count">--</div>
        </div>
        <div class="card">
            <div class="name">Slipzy</div>
            <div id="sl-count" class="count">--</div>
        </div>
    </div>
    <div class="gap-box" id="gap">--</div>

    <script>
        async function getSubs() {
            // Using a public data bridge that doesn't block GitHub
            const hs = await fetch('https://api.subscribercounter.nl/api/youtube-subscriber-count/UCTuC24xs84SjkcWiUJMipiw/live').then(r => r.json());
            const sl = await fetch('https://api.subscribercounter.nl/api/youtube-subscriber-count/UC_dC2t2tNt0ud25kXptF2Xw/live').then(r => r.json());
            
            document.getElementById('hs-count').innerText = hs.count.toLocaleString();
            document.getElementById('sl-count').innerText = sl.count.toLocaleString();
            document.getElementById('gap').innerText = Math.abs(hs.count - sl.count).toLocaleString();
        }
        setInterval(getSubs, 5000);
        getSubs();
    </script>
</body>
</html>
